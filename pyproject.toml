[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-news-detector"
version = "3.0.0"
description = "Industry-grade ML-powered fake news detection system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Core ML
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
    "scipy>=1.13.0",

    # NLP
    "spacy>=3.8.0",

    # Web framework
    "streamlit>=1.40.0",
    "plotly>=5.24.0",

    # API framework
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "slowapi>=0.1.9",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.18",
    "bcrypt>=4.0.0",

    # External APIs
    "requests>=2.32.0",
    "google-generativeai>=0.8.0",

    # Configuration
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7.0",
    "mypy>=1.12",
]
training = [
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]
all = [
    "fake-news-detector[dev,training]",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]  # Line length handled by formatter

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
