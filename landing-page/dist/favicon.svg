  <!-- Checkmark -->
  <path d="M15 24.5l6.5 7L33 18" stroke="url(#checkGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <!-- Subtle V letter accent at top -->
  <path d="M20 10l4 5 4-5" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>