name: Build Android APK

# Run on every push to main, or manually via the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      # 3. Install frontend dependencies
      - name: Install dependencies
        working-directory: landing-page
        run: npm ci

      # 4. Build the web app (Vite)
      - name: Build web app
        working-directory: landing-page
        run: npm run build

      # 5. Sync web assets into the Android project
      - name: Capacitor sync
        working-directory: landing-page
        run: npx cap sync android

      # 6. Set up Java 17 (required by Android Gradle)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 7. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. Make Gradle wrapper executable
      - name: Make Gradle executable
        working-directory: landing-page/android
        run: chmod +x gradlew

      # 9. Build the debug APK
      - name: Build debug APK
        working-directory: landing-page/android
        run: ./gradlew assembleDebug --no-daemon

      # 10. Upload the APK as a downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VerifAI-debug-apk
          path: landing-page/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
